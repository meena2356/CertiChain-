<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CertiChain</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #1769aa, transparent 35%),
        linear-gradient(135deg, #06152b, #0d2948, #1769aa);
    color: white;
    padding: 40px 20px;
}

.container {
    max-width: 650px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

h1 {
    font-size: 46px;
    margin: 0 0 10px;
}

header p {
    font-size: 18px;
    opacity: 0.85;
}

.card {
    background: rgba(255,255,255,0.97);
    color: #172033;
    padding: 30px;
    border-radius: 22px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.25);
}

h2 {
    text-align: center;
    color: #1769aa;
    margin-top: 0;
}

.description {
    text-align: center;
    color: #667085;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ccd5e0;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #1769aa;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

#result {
    margin-top: 25px;
}

.success {
    background: #ecfdf3;
    border: 1px solid #86efac;
    color: #166534;
    padding: 20px;
    border-radius: 14px;
}

.error {
    background: #fef2f2;
    border: 1px solid #fca5a5;
    color: #b91c1c;
    padding: 18px;
    border-radius: 14px;
}

.loading {
    text-align: center;
    padding: 15px;
    color: #1769aa;
    font-weight: bold;
}

.hash {
    word-break: break-all;
    background: #eef4ff;
    padding: 12px;
    border-radius: 8px;
    font-size: 12px;
    color: #172033;
}

footer {
    text-align: center;
    margin-top: 25px;
    opacity: 0.7;
    font-size: 14px;
}

</style>
</head>


<body>

<div class="container">

<header>
    <h1>CertiChain</h1>
    <p>Digital Certificate Verification</p>
</header>


<div class="card">

<h2>Verify Your Certificate</h2>

<p class="description">
Enter your Certificate ID to verify its authenticity.
</p>

<input
    id="certificateID"
    type="text"
    placeholder="Enter Certificate ID e.g. CERT-001"
>

<button onclick="verifyCertificate()">
    Verify Certificate
</button>

<div id="result"></div>

</div>


<footer>
© 2026 CertiChain — Digital Certificate Verification
</footer>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://czsxktpqlqsfozespzly.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
" sb_publishable_EP_DAGlDLkQHgWUqSNbNhA_6AGcdiYM";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =====================================
   EDGE FUNCTION
===================================== */

const FUNCTION_URL =
"https://czsxktpqlqsfozespzly.supabase.co/functions/v1/smart-endpoint";";


/* =====================================
   VERIFY CERTIFICATE
===================================== */

async function verifyCertificate() {

    const input =
        document.getElementById("certificateID");

    const result =
        document.getElementById("result");

    const id =
        input.value.trim().toUpperCase();


    if (id === "") {

        result.innerHTML =
        "<div class='error'>" +
        "⚠️ Please enter a Certificate ID." +
        "</div>";

        return;
    }


    result.innerHTML =
    "<div class='loading'>" +
    "🔍 Verifying certificate..." +
    "</div>";


    /* Get certificate from Supabase */

    const { data, error } =
        await supabaseClient
        .from("certificates")
        .select(
            "certificate_id, student_name, course_name, issue_date, issued_by, status"
        )
        .eq("certificate_id", id)
        .maybeSingle();


    if (error) {

        console.error(error);

        result.innerHTML =
        "<div class='error'>" +
        "❌ Database connection error." +
        "</div>";

        return;
    }


    if (!data) {

        result.innerHTML =
        "<div class='error'>" +
        "❌ Certificate Not Found" +
        "<br><br>" +
        "No certificate with ID <b>" +
        id +
        "</b> was found." +
        "</div>";

        return;
    }


    /* Send Certificate ID to Edge Function */

    try {

        const response =
            await fetch(
                FUNCTION_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                       
     
                        
                      
                          
      

                    body: JSON.stringify({
                        certificate_id:
                            data.certificate_id
                    })
                }
            );


        const blockchainData =
            await response.json();


        if (
            !response.ok ||
            !blockchainData.success
        ) {

            throw new Error(
                "Edge Function failed"
            );
        }


        const certificateHash =
            blockchainData.hash;


        /* Show certificate */

        result.innerHTML =

        "<div class='success'>" +

        "<h3>✅ Certificate Verified</h3>" +

        "<p><b>Certificate ID:</b> " +
        escapeHTML(
            data.certificate_id
        ) +
        "</p>" +

        "<p><b>Student:</b> " +
        escapeHTML(
            data.student_name
        ) +
        "</p>" +

        "<p><b>Course:</b> " +
        escapeHTML(
            data.course_name
        ) +
        "</p>" +

        "<p><b>Issue Date:</b> " +
        escapeHTML(
            data.issue_date
        ) +
        "</p>" +

        "<p><b>Issued By:</b> " +
        escapeHTML(
            data.issued_by
        ) +
        "</p>" +

        "<p><b>Status:</b> " +

        "<span style='color:#15803d;font-weight:bold'>" +

        escapeHTML(
            data.status
        ) +

        " ✓</span></p>" +

        "<hr>" +

        "<p><b>🔐 Certificate Hash</b></p>" +

        "<div class='hash'>" +

        certificateHash +

        "</div>" +

        "</div>";


    } catch (error) {

        console.error(error);

        result.innerHTML =
        "<div class='error'>" +

        "❌ Blockchain service could not be reached." +

        "<br><br>" +

        "Please try again." +

        "</div>";
    }
}


/* =====================================
   SECURITY
===================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================
   ENTER KEY
===================================== */

document
.getElementById("certificateID")
.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            verifyCertificate();
        }

    }
);

</script>

</body>
  </html>
